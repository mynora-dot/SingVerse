name: singverse-frontend
on:
  push:
    paths: ['services/singverse-frontend/**', '.github/workflows/singverse-frontend.yml', 'Makefile', '.editorconfig']
  pull_request:
    paths: ['services/singverse-frontend/**', '.github/workflows/singverse-frontend.yml', 'Makefile', '.editorconfig']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/singverse-frontend/package-lock.json
      - run: make frontend-check
      - uses: actions/upload-artifact@v4
        with:
          name: singverse-frontend
          path: services/singverse-frontend/dist/
          if-no-files-found: error
