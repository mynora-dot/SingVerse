name: singverse-compute-native
on:
  push:
    paths: ['services/singverse-compute/**', 'scripts/setup-transcode-tools.py', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-compute-native.yml']
  pull_request:
    paths: ['services/singverse-compute/**', 'scripts/setup-transcode-tools.py', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-compute-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/singverse-compute/requirements.lock
      - name: Install locked Python runtime dependencies
        run: python -m pip install -r services/singverse-compute/requirements.lock
      - name: Install checksum-pinned portable media tools
        run: python scripts/setup-transcode-tools.py
      - name: Add repository media tools to job PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Execute real media, HTTP, cancellation and contract tests
        working-directory: services/singverse-compute
        run: python -m unittest discover -s tests -v
