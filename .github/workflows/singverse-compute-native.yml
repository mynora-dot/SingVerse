name: singverse-compute-native
on:
  push:
    paths: ['services/singverse-compute/**', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', 'scripts/macos-compute.py', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-compute-native.yml']
  pull_request:
    paths: ['services/singverse-compute/**', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', 'scripts/macos-compute.py', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-compute-native.yml']
  workflow_dispatch:
    inputs:
      audio_model_smoke:
        description: Explicitly install pinned CPU model and run inference smoke test
        type: boolean
        default: false
      mps_model_smoke:
        description: Explicit Apple MPS inference (macOS runner must expose an Apple GPU)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/singverse-compute/requirements.lock
      - name: Install locked Python runtime dependencies
        run: python -m pip install -r services/singverse-compute/requirements.lock
      - name: Install checksum-pinned portable media tools
        run: python scripts/setup-transcode-tools.py
      - name: Add repository media tools to job PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install optional pinned audio runtime and model
        if: github.event_name == 'workflow_dispatch' && (inputs.audio_model_smoke || (inputs.mps_model_smoke && runner.os == 'macOS'))
        run: |
          python -m pip install -r services/singverse-compute/requirements-audio.lock
          python scripts/setup-audio-model.py
      - name: Execute real media, HTTP, cancellation and contract tests
        working-directory: services/singverse-compute
        run: python -m unittest discover -s tests -v
      - name: Verify actual pinned audio model inference
        if: github.event_name == 'workflow_dispatch' && inputs.audio_model_smoke
        env:
          SINGVERSE_TEST_AUDIO_MODEL_REPO: ${{ github.workspace }}/.tools/demucs-htdemucs
        working-directory: services/singverse-compute
        run: python -m unittest tests.integration.test_audio_model -v
      - name: Verify actual Apple MPS against CPU baseline
        if: github.event_name == 'workflow_dispatch' && inputs.mps_model_smoke && runner.os == 'macOS'
        env:
          SINGVERSE_TEST_MPS_MODEL_REPO: ${{ github.workspace }}/.tools/demucs-htdemucs
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
        working-directory: services/singverse-compute
        run: python -m unittest tests.integration.test_mps_audio -v
