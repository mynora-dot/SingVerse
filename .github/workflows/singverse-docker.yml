name: singverse-docker
on:
  push:
    paths: ['services/singverse-compute/**', 'services/singverse-frontend/**', 'services/singverse-java-backend/**', 'infra/docker/**', 'scripts/check-docker-app.py', 'scripts/check-nginx-media.py', 'scripts/check-auth-docker.py', '.github/workflows/singverse-docker.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh']
  pull_request:
    paths: ['services/singverse-compute/**', 'services/singverse-frontend/**', 'services/singverse-java-backend/**', 'infra/docker/**', 'scripts/check-docker-app.py', 'scripts/check-nginx-media.py', 'scripts/check-auth-docker.py', '.github/workflows/singverse-docker.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate administrator OpenAPI 3.1
        run: |
          python -m pip install openapi-spec-validator==0.7.2
          python -m openapi_spec_validator contracts/openapi/singverse.openapi.json
      - name: Validate standalone compute Compose
        run: |
          docker compose --project-directory . -f infra/docker/compose/compose.compute.yaml config --quiet
          docker compose --project-directory . -f infra/docker/compose/compose.compute.nvidia.yaml config --quiet
      - name: Validate optional audio runtime Compose profiles
        run: |
          docker compose --project-directory . -f infra/docker/compose/compose.app.yaml -f infra/docker/compose/compose.audio-cpu.yaml config --quiet
          COMPUTE_RENDER_GID=1000 docker compose --project-directory . -f infra/docker/compose/compose.app.yaml -f infra/docker/compose/compose.audio-openvino.yaml config --quiet
          docker compose --project-directory . -f infra/docker/compose/compose.app.yaml -f infra/docker/compose/compose.audio-cuda.yaml config --quiet
          SINGVERSE_RENDER_GID=1000 SINGVERSE_VIDEO_GID=1001 docker compose --project-directory . -f infra/docker/compose/compose.app.yaml -f infra/docker/compose/compose.audio-rocm.yaml config --quiet
      - name: Verify media streams without proxy buffering
        run: |
          node_image="$(sed -n 's/^ARG NODE_IMAGE=//p' services/singverse-java-backend/Dockerfile)"
          nginx_image="$(sed -n 's/^ARG NGINX_IMAGE=//p' services/singverse-java-backend/Dockerfile)"
          docker pull "$node_image"
          docker pull "$nginx_image"
          python scripts/check-nginx-media.py --nginx-image "$nginx_image" --backend-image "$node_image"
      - name: Build and start application
        run: make docker-up
      - name: Verify public HTTP routes
        run: make docker-check
      - name: Verify MFA and local recovery in isolated containers
        run: make auth-docker-check
      - name: Container logs
        if: failure()
        run: docker compose --project-directory . -f infra/docker/compose/compose.app.yaml logs --tail 100
      - name: Stop application and keep volumes
        if: always()
        run: make docker-down
