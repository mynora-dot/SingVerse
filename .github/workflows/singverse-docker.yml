name: singverse-docker
on:
  push:
    paths: ['infra/**', '.dockerignore', '.env.example', 'Makefile', 'scripts/check-backend-contract.py', '.github/workflows/singverse-docker.yml']
  pull_request:
    paths: ['infra/**', '.dockerignore', '.env.example', 'Makefile', 'scripts/check-backend-contract.py', '.github/workflows/singverse-docker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make docker-config-check docker-context-check docker-test
      - run: make docker-build
      - run: make go-container-check auth-docker-check
      - name: Check both deployment routes in disposable projects
        run: python3 infra/docker/check-compose.py --backend-image singverse:local
      - run: make compute-images COMPUTE_RUNTIME=base
      - name: Check optional and independent compute authentication and callbacks
        run: python3 infra/docker/check-compute-compose.py
