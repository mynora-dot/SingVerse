name: singverse-compute-images
on:
  pull_request:
    paths: ['services/singverse-compute/**', '.dockerignore', 'docker-bake.hcl', 'compose*', '.github/workflows/singverse-compute-images.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: compute-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, xml.etree.ElementTree as ET
          version = ET.parse('services/singverse-java-backend/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          if os.environ.get('RELEASE_TAG'):
              version = version.removesuffix('-SNAPSHOT')
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match Java version'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-SNAPSHOT)?', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nimage=ghcr.io/{os.environ["GITHUB_REPOSITORY_OWNER"].lower()}/singverse-compute\n')
          PY
  build:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: cpu, arch: amd64, runner: ubuntu-24.04 }
          - { variant: cpu, arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: cuda, arch: amd64, runner: ubuntu-24.04 }
          - { variant: rocm, arch: amd64, runner: ubuntu-24.04 }
          - { variant: openvino, arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login for explicit release publishing
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/singverse-compute/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: singverse-compute:check
          build-args: |
            SINGVERSE_VERSION=${{ needs.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=compute-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=compute-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Check installed runtime and build identity without GPU claims
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --network none -e EXPECTED_VARIANT="$VARIANT" singverse-compute:check python -c "import os,torch,torchaudio; from singverse_compute.core.build_info import build_info; assert build_info()['variant']==os.environ['EXPECTED_VARIANT']; assert torch.__version__.split('+')[0]=='2.5.1'; assert torchaudio.__version__.split('+')[0]=='2.5.1'"
          if [ "$VARIANT" = openvino ]; then
            docker run --rm --network none singverse-compute:check python -c "import openvino; from importlib.metadata import version; assert version('openvino')=='2025.4.0'"
          fi
      - name: Publish immutable architecture tag after checks
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:$VERSION-$VARIANT-$ARCH"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo 'Release image already exists; use a new version instead of replacing it.' >&2
            exit 1
          fi
          docker tag singverse-compute:check "$tag"
          docker push "$tag"
  manifests:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend manifests after every architecture passes
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION-cpu" "$IMAGE:$VERSION-cpu-amd64" "$IMAGE:$VERSION-cpu-arm64"
          for variant in cuda rocm openvino; do
            docker buildx imagetools create -t "$IMAGE:$VERSION-$variant" "$IMAGE:$VERSION-$variant-amd64"
          done
