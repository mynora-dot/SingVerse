name: singverse-mobile
on:
  push:
    paths: ['services/singverse-mobile/**', 'scripts/check-mobile-karaoke.py', 'scripts/setup-mobile-karaoke-fixtures.py', '.github/workflows/singverse-mobile.yml', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/compute-internal.openapi.json', 'Makefile', '.editorconfig', '.gitignore']
  pull_request:
    paths: ['services/singverse-mobile/**', 'scripts/check-mobile-karaoke.py', 'scripts/setup-mobile-karaoke-fixtures.py', '.github/workflows/singverse-mobile.yml', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/compute-internal.openapi.json', 'Makefile', '.editorconfig', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/singverse-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest
        working-directory: services/singverse-mobile/android
      - run: flutter build apk --debug
