name: singverse-tv
on:
  push:
    paths: ['services/singverse-tv/**', '.github/workflows/singverse-tv.yml', 'Makefile', '.editorconfig', '.gitignore']
  pull_request:
    paths: ['services/singverse-tv/**', '.github/workflows/singverse-tv.yml', 'Makefile', '.editorconfig', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/singverse-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintDebug
