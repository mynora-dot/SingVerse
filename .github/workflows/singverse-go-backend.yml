name: singverse-go-backend
on:
  push:
    paths: ['services/singverse-go-backend/**', 'services/singverse-frontend/**', '.github/workflows/singverse-go-backend.yml', 'Makefile', 'VERSION', '.env.example', 'database/**', 'contracts/**', 'scripts/*go*', 'infra/docker/check-go-mysql.py', 'infra/docker/check-go-container.py', 'infra/docker/build/**', 'scripts/setup-dbmate.sh', 'scripts/check-database-baseline.py']
  pull_request:
    paths: ['services/singverse-go-backend/**', 'services/singverse-frontend/**', '.github/workflows/singverse-go-backend.yml', 'Makefile', 'VERSION', '.env.example', 'database/**', 'contracts/**', 'scripts/*go*', 'infra/docker/check-go-mysql.py', 'infra/docker/check-go-container.py', 'infra/docker/build/**', 'scripts/setup-dbmate.sh', 'scripts/check-database-baseline.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/singverse-frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/singverse-go-backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis and migration tools
        run: make go-tools-setup dbmate-setup
      - name: Verify fresh database baseline
        run: make db-fresh-check
      - name: Verify Go formatting, vet, static analysis, vulnerabilities and race tests
        run: make go-backend-test
      - name: Verify isolated MySQL business behavior
        run: make go-mysql-check
      - name: Build the versioned CGO-free backend
        run: make go-backend-build
      - name: Verify real terminal-only administrator recovery in disposable data
        run: python3 scripts/check-go-recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: singverse-go-backend-linux-amd64
          path: services/singverse-go-backend/bin/singverse
          if-no-files-found: error
