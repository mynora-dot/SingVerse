name: singverse-backend
on:
  push:
    paths: ['services/singverse-compute/**', 'services/singverse-go-backend/**', 'services/singverse-frontend/**', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-backend.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh', 'scripts/check-database-baseline.py', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', 'scripts/*go*', 'infra/docker/check-go-mysql.py', 'infra/docker/check-go-container.py', 'scripts/check-backend-contract.py', 'VERSION', '.editorconfig', '.gitignore']
  pull_request:
    paths: ['services/singverse-compute/**', 'services/singverse-go-backend/**', 'services/singverse-frontend/**', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-backend.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh', 'scripts/check-database-baseline.py', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', 'scripts/*go*', 'infra/docker/check-go-mysql.py', 'infra/docker/check-go-container.py', 'scripts/check-backend-contract.py', 'VERSION', '.editorconfig', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/singverse-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/singverse-compute/requirements.lock
      - name: Install checksum-pinned media tools
        run: |
          python scripts/setup-transcode-tools.py
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install database migration tool
        run: make -C "${{ github.workspace }}" dbmate-setup
      - name: Verify fresh database baseline
        run: make -C "${{ github.workspace }}" db-fresh-check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/singverse-go-backend/go.sum
      - run: make go-tools-setup
      - run: make compute-setup
      - name: Verify Go and Python backend integration
        run: make backend-check
