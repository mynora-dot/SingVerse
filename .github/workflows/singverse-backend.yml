name: singverse-backend
on:
  push:
    paths: ['services/singverse-compute/**', 'services/singverse-java-backend/**', 'services/singverse-frontend/**', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-backend.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', '.editorconfig', '.gitignore']
  pull_request:
    paths: ['services/singverse-compute/**', 'services/singverse-java-backend/**', 'services/singverse-frontend/**', 'contracts/openapi/compute-internal.openapi.json', '.github/workflows/singverse-backend.yml', 'Makefile', 'database/**', 'contracts/openapi/singverse.openapi.json', 'contracts/openapi/auth-test-vectors.json', 'scripts/setup-dbmate.sh', 'scripts/setup-transcode-tools.py', 'scripts/setup-audio-model.py', '.editorconfig', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/singverse-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/singverse-compute/requirements.lock
      - name: Install checksum-pinned media tools
        run: |
          python scripts/setup-transcode-tools.py
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/jellyfin-ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install database migration tool
        run: make -C "${{ github.workspace }}" dbmate-setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/singverse-java-backend/pom.xml
      - run: make compute-setup
      - name: Verify Java and Python backend integration
        run: make backend-check
