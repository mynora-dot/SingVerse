<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SingVerse · TV 首页视觉预览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="brand" viewBox="0 0 24 24"><path d="M3 9v6M7.5 4v16M12 7v10M16.5 2v20M21 8v8"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 6 6"/></symbol>
    <symbol id="mic" viewBox="0 0 24 24"><rect x="8" y="1" width="8" height="14" rx="4"/><path d="M4 10v2a8 8 0 0 0 16 0v-2M12 20v3M8 23h8"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="14" y="2" width="8" height="8" rx="2"/><rect x="2" y="14" width="8" height="8" rx="2"/><rect x="14" y="14" width="8" height="8" rx="2"/></symbol>
    <symbol id="disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M5 10a7 7 0 0 1 5-5m4 14a7 7 0 0 0 5-5"/></symbol>
    <symbol id="phone" viewBox="0 0 24 24"><rect x="6" y="1" width="12" height="22" rx="3"/><path d="M10 19h4"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </defs></svg>
  <main id="tv" aria-label="SingVerse TV 首页视觉原型">
    <header>
      <div class="brand"><svg><use href="#brand"/></svg>SingVerse</div>
      <nav aria-label="主导航">
        <button class="nav active" data-destination="首页" aria-current="page">首页</button>
        <button class="nav" data-destination="找歌">找歌</button>
        <button class="nav" data-destination="歌手">歌手</button>
        <button class="nav" data-destination="分类">分类</button>
        <button class="nav" data-destination="歌单">歌单</button>
        <button class="nav" data-destination="已点">已点 <span class="count">3</span></button>
        <button class="nav" data-destination="设置">设置</button>
      </nav>
      <button class="join" data-destination="手机加入"><svg><use href="#phone"/></svg>手机加入</button>
    </header>
    <div class="scroller" id="content">
      <section class="hero" aria-label="推荐歌曲">
        <div class="hero-copy">
          <p class="eyebrow">今晚的第一首</p>
          <h1>把生活，唱成热爱。</h1>
          <p class="hero-song">平凡之路 <span>/</span> 朴树</p>
          <p class="hero-description">平凡的日子，也值得一场尽兴的演唱。</p>
          <div class="hero-actions">
            <button id="initial" class="primary" data-song="0" data-action="sing"><svg><use href="#mic"/></svg>立即点唱</button>
            <button class="secondary" data-song="0">查看详情</button>
          </div>
        </div>
        <div class="hero-signature"><span>SING YOUR MOMENT</span><small>你的私人音乐现场</small></div>
      </section>
      <section class="shortcuts" aria-label="快捷点歌">
        <button data-destination="找歌"><svg><use href="#search"/></svg><span><strong>找一首歌</strong><small>歌名 / 拼音 / 编号</small></span><svg class="chevron"><use href="#arrow"/></svg></button>
        <button data-destination="歌手"><svg><use href="#mic"/></svg><span><strong>歌手点歌</strong><small>从熟悉的声音开始</small></span><svg class="chevron"><use href="#arrow"/></svg></button>
        <button data-destination="分类"><svg><use href="#grid"/></svg><span><strong>分类点歌</strong><small>发现合拍的音乐</small></span><svg class="chevron"><use href="#arrow"/></svg></button>
        <button data-destination="歌单"><svg><use href="#disc"/></svg><span><strong>精选歌单</strong><small>为每一次相聚准备</small></span><svg class="chevron"><use href="#arrow"/></svg></button>
      </section>
      <section class="library" aria-labelledby="library-title">
        <div class="section-heading"><h2 id="library-title">我的曲库</h2><p>128 首好歌，等你开唱</p><button data-destination="找歌">查看全部 <svg><use href="#arrow"/></svg></button></div>
        <div class="song-rail" id="songs" aria-label="曲库歌曲"></div>
      </section>
      <section class="playlists" aria-labelledby="playlist-title">
        <div class="section-heading"><h2 id="playlist-title">为相聚选一张歌单</h2><p>让气氛，顺着音乐升温</p><button data-destination="歌单">全部歌单 <svg><use href="#arrow"/></svg></button></div>
        <div class="playlist-rail">
          <button class="playlist green" data-destination="歌单"><div class="landscape"></div><span><strong>华语经典 · 一开口就会唱</strong><small>24 首 · 演示歌单</small></span></button>
          <button class="playlist blue" data-destination="歌单"><div class="landscape"></div><span><strong>放肆合唱 · 今晚不散场</strong><small>18 首 · 演示歌单</small></span></button>
          <button class="playlist rose" data-destination="歌单"><div class="landscape"></div><span><strong>慢调时光 · 唱给自己听</strong><small>16 首 · 演示歌单</small></span></button>
        </div>
      </section>
    </div>
    <footer><span class="connection">家庭 NAS · 连接状态演示</span><span class="remote"><b>✥</b> 方向键移动 <kbd>OK</kbd> 选择 <b>‹</b> 返回</span><span class="prototype">视觉原型 · 全部数据为演示</span></footer>
    <dialog aria-labelledby="dialog-title">
      <p class="eyebrow">SINGVERSE · 视觉演示</p><h2 id="dialog-title"></h2>
      <div id="dialog-song"></div><p id="dialog-description"></p>
      <div class="dialog-actions"><button id="close" class="primary">返回首页</button><button id="demo-add" class="secondary" hidden>演示加入已点</button></div>
    </dialog>
  </main>
  <script src="preview.js"></script>
</body>
</html>
