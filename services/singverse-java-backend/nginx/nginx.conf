worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  upstream singverse_java_backend {
    server singverse-java-backend:8080;
  }

  server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 完整 frontend/dist 挂载到此目录；管理端对外使用根路径。
    root /usr/share/nginx/html/admin;
    index index.html;

    location = /api/v1/audio-processing/model/import {
      client_max_body_size 128m;
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    location ~ ^/api/v1/media-sources/[A-Za-z0-9-]+/embedded-metadata/share$ {
      client_max_body_size 8g;
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    # Only managed cover uploads accept multipart bodies above the normal JSON limit.
    location ~ ^/api/v1/(?:metadata/songs/[A-Za-z0-9-]+/covers/upload|classification/tags/[A-Za-z0-9-]+/cover|artists/[A-Za-z0-9-]+/images/(?:portrait|background))$ {
      client_max_body_size 3m;
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    location ~ ^/api/v1/media-sources/[A-Za-z0-9-]+/embedded-metadata/share-jobs/[A-Za-z0-9-]+/download$ {
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    # Original and compatible media streams: forward Range requests without buffering media to disk.
    location ~ ^/api/v1/(?:media-songs/[A-Za-z0-9-]+/video|(?:tv/transcoding|transcoding/sessions)/[A-Za-z0-9-]+/artifacts/[A-Za-z0-9_.-]+|(?:tv/transcoding|transcoding/sessions)/versions/[A-Za-z0-9-]+/[A-Za-z0-9-]+)$ {
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 60s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    # 保留 /api 前缀及查询参数，未知接口也交给后端返回真实状态。
    location ~ ^/api(?:/|$) {
      proxy_pass http://singverse_java_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      include /etc/nginx/proxy-scheme.conf;
    }

    location = /party {
      return 308 /party/;
    }

    # 两个页面共用的构建资源不受管理入口映射影响。
    location ^~ /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location ^~ /party/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ =404;
    }

    # 同时兼容直接使用 /admin/；对外根路径和该入口共享同一份文件。
    location = /admin {
      return 308 /admin/;
    }

    location ^~ /admin/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
