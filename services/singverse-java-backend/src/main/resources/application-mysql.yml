spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:singverse}?connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=5000
    username: ${MYSQL_USER:singverse}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      validation-timeout: 3000
      connection-test-query: SELECT 1
