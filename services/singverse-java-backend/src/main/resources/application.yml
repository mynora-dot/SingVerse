spring:
  application:
    name: singverse-java-backend
  profiles:
    default: sqlite
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    problemdetails:
      enabled: true
  sql:
    init:
      mode: never
server:
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  port: ${SERVER_PORT:8080}
singverse:
  auth:
    key-file: ${SINGVERSE_AUTH_KEY_FILE:}
    public-origin: ${SINGVERSE_PUBLIC_ORIGIN:}
    trusted-proxies: ${SINGVERSE_TRUSTED_PROXIES:}
  metadata:
    cache-path: ${METADATA_CACHE_PATH:./data/metadata/covers}
  compute:
    base-url: ${COMPUTE_NODE_URL:}
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    jdbc-type-for-null: 'NULL'
    local-cache-scope: STATEMENT
    call-setters-on-nulls: true
