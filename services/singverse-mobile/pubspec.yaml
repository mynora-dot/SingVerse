name: singverse_mobile
description: SingVerse NAS library and local Android player.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  webview_flutter: ^4.14.1
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: system
