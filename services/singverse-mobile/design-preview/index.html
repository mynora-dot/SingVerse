<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>SingVerse · 手机播放器设计预览</title>
  <link rel="icon" href="../../../assets/branding/icons/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" class="solid"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="4"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" class="solid"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></symbol>
      <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M8 21v-5H3M16 21v-5h5"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1.8 8M3 4v6h6"/></symbol>
      <symbol id="i-tune" viewBox="0 0 24 24"><path d="M5 3v7M5 14v7M12 3v2M12 9v12M19 3v11M19 18v3M2 10h6M9 5h6M16 14h6"/></symbol>
      <symbol id="i-range" viewBox="0 0 24 24"><path d="M8 5H5v14h3M16 5h3v14h-3M9 12h6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5 2M9 4a3 3 0 0 1 6 1v4M5 10v2a7 7 0 0 0 12 5M19 10v2M12 19v3M8 22h8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="17" cy="16" rx="3" ry="3"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4M7.5 6v12M12 3v18M16.5 7v10M21 10v4"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A9 9 0 0 1 9.5 3.5a9 9 0 1 0 11 11Z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0M12 20h.01"/></symbol>
      <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M23 10v4M5 10h11v4H5Z"/></symbol>
    </defs>
  </svg>

  <header class="review-header">
    <a class="brand" href="./" aria-label="SingVerse 设计预览首页">
      <img src="../../../assets/branding/icons/logo-mark-128.png" width="32" height="32" alt="">
      <span>SingVerse</span><span class="brand-divider"></span><span class="brand-caption">手机播放器</span>
    </a>
    <span class="review-tag"><span></span>交互设计稿</span>
  </header>

  <main class="review-main">
    <section class="review-intro" aria-labelledby="review-title">
      <div><p class="eyebrow">A LITTLE MORE MUSIC. A LITTLE LESS NOISE.</p><h1 id="review-title">让每一句，都有自己的舞台。</h1></div>
      <p class="review-description">夜色里沉浸，留白中轻唱。<br>选一种你喜欢的播放器。</p>
    </section>

    <section class="review-toolbar" aria-label="设计稿预览设置">
      <div class="scene-picker" role="group" aria-label="播放场景">
        <button type="button" data-scene="mv" aria-pressed="true">MV 播放</button>
        <button type="button" data-scene="audio" aria-pressed="false">音频 / 歌词</button>
        <button type="button" data-scene="landscape" aria-pressed="false">横屏舞台</button>
      </div>
      <div class="review-options">
        <label><input type="checkbox" id="large-text">大字 1.8×</label>
        <label><input type="checkbox" id="senior-targets">长辈触控</label>
      </div>
      <div class="theme-picker" role="group" aria-label="查看方案">
        <button type="button" data-theme="dark" aria-pressed="true">A · 沉浸深色</button>
        <button type="button" data-theme="light" aria-pressed="false">B · 清爽浅色</button>
      </div>
    </section>

    <div id="gallery" class="gallery" data-scene="mv" data-mobile-theme="dark" aria-label="两版播放器设计对比"></div>

    <footer class="review-footer">
      <span><span class="demo-dot"></span>示例歌曲与原创歌词 · 无真实播放或录音</span>
      <span>可以点按播放、伴奏、调音和录音，感受操作。</span>
    </footer>
    <noscript>请启用 JavaScript 查看可交互的播放器设计稿。</noscript>
  </main>
</body>
</html>
