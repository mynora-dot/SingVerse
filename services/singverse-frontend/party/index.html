<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11151c">
    <meta name="description" content="SingVerse 家庭 KTV">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
    <title>SingVerse</title>
    <link rel="stylesheet" href="/party/assets/welcome.css">
  </head>
  <body>
    <main class="welcome">
      <div class="halo" aria-hidden="true"></div>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="2" y="2" width="60" height="60" rx="20" />
          <path d="M37 17v25c0 5-5 8-10 6-5-2-5-8 0-10 2-1 5-1 7 0V21l15-4v8l-12 3" />
        </svg>
      </span>
      <p class="eyebrow">相聚 · 开唱</p>
      <h1>SingVerse</h1>
      <p class="message">欢迎来到家庭 KTV</p>
      <p class="note">让每一次相聚，都有好歌相伴。</p>
      <ul class="hints">
        <li>
          <span class="hint-label">自备</span>
          <strong>歌曲来自你的 NAS</strong>
          <small>不依赖任何在线曲库</small>
        </li>
        <li>
          <span class="hint-label">家里</span>
          <strong>由家里的设备播放</strong>
          <small>电视、音响与手机同处一个网络</small>
        </li>
        <li>
          <span class="hint-label">正在</span>
          <strong>点歌与播放筹备中</strong>
          <small>当前是欢迎页，功能会逐步开放</small>
        </li>
      </ul>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <footer class="foot"><span class="dot" aria-hidden="true"></span>由家里的 NAS 提供服务</footer>
    </main>
  </body>
</html>
