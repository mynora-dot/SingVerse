[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singverse-compute"
version = "0.1.0"
description = "SingVerse Python 计算节点骨架"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
]

[tool.setuptools.packages.find]
include = ["singverse_compute*"]
