# Intel QSV or AMD VA-API; works with compose.app.yaml and compose.compute.yaml.
services:
  singverse-compute:
    environment:
      COMPUTE_HARDWARE_BACKEND: '${COMPUTE_HARDWARE_BACKEND:-qsv}'
      COMPUTE_HARDWARE_DEVICE: '${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}'
    devices:
      - '${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}:${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}'
    group_add:
      - '${COMPUTE_RENDER_GID:?Set COMPUTE_RENDER_GID to the host render device group ID}'
