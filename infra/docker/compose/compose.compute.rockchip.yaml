# RK3588/RK3588S with matching BSP kernel, MPP/RGA and device permissions.
services:
  singverse-compute:
    environment:
      COMPUTE_HARDWARE_BACKEND: rkmpp
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - '${COMPUTE_RENDER_GID:?Set COMPUTE_RENDER_GID to the host device group ID}'
