# Linux x86_64 with a ROCm-compatible GPU/kernel. Do not force unsupported GPU identifiers.
services:
  singverse-compute:
    image: '${COMPUTE_IMAGE:-singverse-compute:local-rocm}'
    build:
      target: rocm
    environment:
      COMPUTE_HARDWARE_BACKEND: '${COMPUTE_HARDWARE_BACKEND:-auto}'
      COMPUTE_HARDWARE_DEVICE: '${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}'
    mem_limit: '${COMPUTE_CONTAINER_MEMORY_LIMIT:-6g}'
    shm_size: '256m'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - '${SINGVERSE_RENDER_GID:?Set the host render group numeric ID}'
      - '${SINGVERSE_VIDEO_GID:?Set the host video group numeric ID}'
