# Intel GPU inference is independent of QSV video decoding.
services:
  singverse-compute:
    image: '${COMPUTE_IMAGE:-singverse-compute:local-openvino}'
    build:
      target: openvino
    environment:
      COMPUTE_HARDWARE_BACKEND: '${COMPUTE_HARDWARE_BACKEND:-auto}'
      COMPUTE_HARDWARE_DEVICE: '${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}'
    mem_limit: '${COMPUTE_CONTAINER_MEMORY_LIMIT:-6g}'
    devices:
      - '${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}:${COMPUTE_HARDWARE_DEVICE:-/dev/dri/renderD128}'
    group_add:
      - '${COMPUTE_RENDER_GID:?Set COMPUTE_RENDER_GID to the host render device group ID}'
