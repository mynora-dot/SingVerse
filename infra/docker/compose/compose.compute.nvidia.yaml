# RTX 3070 / A3000 standalone node; run from the repository root on Linux amd64.
# Requires a compatible NVIDIA driver and NVIDIA Container Toolkit on the host.
# All deployment values are literal: no .env or shell exports are required.
name: singverse-compute-node
services:
  singverse-compute:
    image: singverse-compute:local-cuda
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/singverse-compute/Dockerfile
      target: cuda
      args:
        SOURCE_REVISION: local
    environment:
      COMPUTE_AUTH_TOKEN_FILE: /run/singverse-compute/token
      COMPUTE_LAN_PAIRING_ENABLED: 'true'
      COMPUTE_HARDWARE_BACKEND: nvenc
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      COMPUTE_PROCESS_MEMORY_BYTES: "1073741824"
      COMPUTE_TRANSCODE_CONCURRENCY: "1"
      COMPUTE_AUDIO_MODEL_REPO: /var/lib/singverse-models/htdemucs
      COMPUTE_AUDIO_MEMORY_BYTES: "4294967296"
      COMPUTE_AUDIO_THREADS: "2"
    ports:
      # For remote Go, replace 127.0.0.1 with this host's private LAN IP.
      # Restrict inbound access to the Go host; keep authentication enabled.
      - "127.0.0.1:18090:8090"
    volumes:
      - singverse-compute-auth:/run/singverse-compute
      - singverse-transcode-cache:/var/cache/singverse-transcode
      - singverse-audio-models:/var/lib/singverse-models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 6g
    cpus: 2.0
    restart: unless-stopped
    stop_grace_period: 10s
volumes:
  singverse-compute-auth:
  # Includes persistent hardware/model settings and qualification records.
  singverse-transcode-cache:
  # Weights are kept apart from the settings in transcode-cache.
  singverse-audio-models:
