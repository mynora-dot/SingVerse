# Optional existing host directory. Only Java reads originals; compute uses authorized callbacks.
# Apply after compose.app.yaml. WebDAV-only deployments do not need this file.
services:
  singverse-java-backend:
    volumes:
      - type: bind
        source: '${SINGVERSE_MEDIA_PATH:?Set SINGVERSE_MEDIA_PATH to an existing absolute media directory}'
        target: /media
        read_only: true
        bind:
          create_host_path: false
