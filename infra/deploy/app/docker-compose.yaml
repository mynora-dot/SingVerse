name: singverse-go-business

services:
  singverse-go-backend:
    image: singverse-go-backend:remote
    build:
      context: .
      dockerfile: infra/docker/build/go.Dockerfile
      target: singverse-go-backend
    environment:
      SINGVERSE_DB_DRIVER: sqlite
      SINGVERSE_BIND_ADDRESS: 0.0.0.0
      SQLITE_PATH: /data/singverse.db
      SERVER_PORT: '8080'
      COMPUTE_NODE_URL: ''
      # For a separate compute node, set a business URL reachable FROM that node.
      SINGVERSE_CALLBACK_ORIGIN: ''
      SINGVERSE_PUBLIC_ORIGIN: ''
      SINGVERSE_TRUSTED_PROXIES: ''
      SINGVERSE_AUTH_KEY_FILE: /secrets/master.key
      WEBDAV_METADATA_PATH: /data/metadata/webdav
      METADATA_CACHE_PATH: /data/metadata/covers
      TRANSCODE_VERSION_PATH: /data/transcoding
      SINGVERSE_SONG_CACHE_PATH: /data/transcoding/cache
      SINGVERSE_SONG_CACHE_BYTES: '${SINGVERSE_SONG_CACHE_BYTES:-10737418240}'
      SINGVERSE_SONG_CACHE_MINIMUM_FREE_BYTES: '${SINGVERSE_SONG_CACHE_MINIMUM_FREE_BYTES:-2147483648}'
      AUDIO_DERIVED_PATH: /data/audio-roles
    volumes:
      - singverse-data:/data
      - singverse-secrets:/secrets
      - singverse-downloads:/downloads
      - type: bind
        source: ./media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 20s

  singverse-frontend:
    image: singverse-frontend:remote
    build:
      context: .
      dockerfile: infra/docker/build/go.Dockerfile
      target: singverse-frontend
    ports:
      # Change only the host IP to this NAS's private LAN IP for TV/mobile access.
      - '127.0.0.1:18080:80'
    depends_on:
      singverse-go-backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  singverse-data:
  singverse-secrets:
  singverse-downloads:
