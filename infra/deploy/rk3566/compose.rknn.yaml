# Enable only after obtaining a verified converted model and matching host driver.
services:
  singverse-compute:
    image: singverse-compute:rk3566-rknn
    build:
      target: rknn
    devices:
      - '${RKNPU_CARD_DEVICE:-/dev/dri/card0}:/dev/dri/card0'
      - '${RKNPU_DEVICE:-/dev/dri/renderD129}:/dev/dri/renderD129'
    group_add:
      - '${RKNPU_CARD_GID:?Set RKNPU_CARD_GID to the NPU primary device group ID}'
      - '${RKNPU_GID:?Set RKNPU_GID to the NPU device group ID}'
    volumes:
      - type: bind
        source: /usr/lib/librknnrt.so
        target: /usr/lib/librknnrt.so
        read_only: true
        bind:
          create_host_path: false
      - /sys/firmware/devicetree/base:/run/singverse-hardware/device-tree:ro
      - /sys/firmware/devicetree/base/compatible:/proc/device-tree/compatible:ro
      - ./models/uvr-mdxnet-9482-rknn:/var/lib/singverse-models/uvr-mdxnet-9482-rknn:ro
